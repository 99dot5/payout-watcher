name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: cargo test --locked -p payout-watcher
      - name: Lint
        run: cargo clippy --locked -p payout-watcher --all-targets -- -D warnings
